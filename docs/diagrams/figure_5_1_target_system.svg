<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ภาพรวมระบบ AquaMind ฉบับเป้าหมาย</title>
  <desc id="desc">Weather และ Ocean เป็นข้อมูลหลัก Sentinel-2 เป็นหลักฐานรอง ผ่านการตรวจคุณภาพไปยังโมเดล ดัชนี แดชบอร์ด และวงจร Ground Truth</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .title{font:700 34px 'Noto Sans Thai','Tahoma',sans-serif;fill:#0f172a}.sub{font:400 18px 'Noto Sans Thai','Tahoma',sans-serif;fill:#475569}
      .h{font:700 22px 'Noto Sans Thai','Tahoma',sans-serif;fill:#0f172a}.t{font:400 17px 'Noto Sans Thai','Tahoma',sans-serif;fill:#334155}.small{font:400 15px 'Noto Sans Thai','Tahoma',sans-serif;fill:#475569}
      .line{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#0f766e;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="title">ภาพที่ 5-1  ภาพรวมระบบ AquaMind ฉบับเป้าหมาย</text>
  <text x="70" y="100" class="sub">Weather/Ocean เป็นแกนหลัก · Sentinel-2 เป็นหลักฐานรอง · Ground Truth เปิดทางสู่ Operational probability</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="250" height="115" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="195" y="198" text-anchor="middle" class="h">Weather Forecast</text><text x="195" y="232" text-anchor="middle" class="t">ข้อมูลหลักตามพิกัด</text>
    <rect x="70" y="305" width="250" height="115" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
    <text x="195" y="348" text-anchor="middle" class="h">Marine Forecast</text><text x="195" y="382" text-anchor="middle" class="t">SST · คลื่น · กระแสน้ำ</text>
    <rect x="70" y="455" width="250" height="115" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="195" y="498" text-anchor="middle" class="h">Sentinel-2 L2A</text><text x="195" y="532" text-anchor="middle" class="t">หลักฐานรองแบบมี QC</text>
    <rect x="70" y="605" width="250" height="115" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="195" y="648" text-anchor="middle" class="h">Verified Ground Truth</text><text x="195" y="682" text-anchor="middle" class="t">ผลตรวจน้ำ/เหตุการณ์จริง</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="250" width="270" height="170" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <text x="545" y="300" text-anchor="middle" class="h">Quality &amp; Freshness Gate</text>
    <text x="545" y="338" text-anchor="middle" class="t">Schema · Data age · Missingness</text>
    <text x="545" y="372" text-anchor="middle" class="t">Cloud / Water-pixel QC</text>
    <rect x="410" y="485" width="270" height="130" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="545" y="535" text-anchor="middle" class="h">Feature Store / PostGIS</text>
    <text x="545" y="572" text-anchor="middle" class="t">Version · Lineage · Decision time</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="175" width="330" height="185" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="955" y="222" text-anchor="middle" class="h">Environmental Watch</text>
    <text x="955" y="258" text-anchor="middle" class="t">Weather-first model + SHAP</text>
    <text x="955" y="294" text-anchor="middle" class="t">ทำงานได้เมื่อไม่มีภาพ</text>
    <text x="955" y="328" text-anchor="middle" class="small">ผล: Watch index ไม่ใช่ Probability</text>
    <rect x="790" y="455" width="330" height="185" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="955" y="502" text-anchor="middle" class="h">Operational Bloom Model</text>
    <text x="955" y="538" text-anchor="middle" class="t">Temporal / Spatial validation</text>
    <text x="955" y="574" text-anchor="middle" class="t">Calibration + Approval gate</text>
    <text x="955" y="608" text-anchor="middle" class="small">เปิดเมื่อ Ground Truth เพียงพอเท่านั้น</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1230" y="235" width="300" height="150" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1380" y="285" text-anchor="middle" class="h">Decision API</text>
    <text x="1380" y="323" text-anchor="middle" class="t">Index · Evidence · Data age</text>
    <text x="1380" y="355" text-anchor="middle" class="t">SHAP · Rule actions</text>
    <rect x="1230" y="470" width="300" height="150" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="1380" y="520" text-anchor="middle" class="h">Dashboard &amp; Alert</text>
    <text x="1380" y="558" text-anchor="middle" class="t">ภาษาชาวบ้าน + Checklist</text>
    <text x="1380" y="590" text-anchor="middle" class="t">ตรวจน้ำก่อนลงมือ</text>
  </g>

  <path class="line" d="M320 212 H375 Q395 212 410 285"/><path class="line" d="M320 362 H410"/><path class="line" d="M320 512 H375 Q395 512 410 385"/>
  <path class="line" d="M545 420 V485"/><path class="line" d="M680 530 H730 Q760 530 790 305"/><path class="line" d="M680 570 H790"/>
  <path class="line" d="M1120 268 H1230"/><path class="line" d="M1120 548 H1170 Q1200 548 1230 360"/><path class="line" d="M1380 385 V470"/>
  <path class="dash" d="M1230 590 H1165 Q1135 590 1120 585"/><path class="dash" d="M790 600 H720 Q690 600 680 590"/><path class="dash" d="M410 590 H355 Q330 590 320 662"/>

  <rect x="70" y="795" width="1460" height="60" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="105" cy="825" r="9" fill="#06b6d4"/><text x="125" y="832" class="small">ข้อมูลหลัก</text>
  <circle cx="265" cy="825" r="9" fill="#3b82f6"/><text x="285" y="832" class="small">หลักฐานรอง</text>
  <circle cx="460" cy="825" r="9" fill="#22c55e"/><text x="480" y="832" class="small">ข้อมูลยืนยัน/ระบบอนาคต</text>
  <text x="870" y="832" class="small">เส้นประ = Feedback และวงจรเรียนรู้หลังผู้ตรวจสอบรับรองข้อมูล</text>
</svg>
