<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">โครงสร้างซอฟต์แวร์ AquaMind ปัจจุบัน</title>
  <desc id="desc">แผนภาพโครงสร้าง repository แบ่งเป็นรายงาน backend โมเดลและข้อมูล frontend Streamlit และการทดสอบ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.title{font:700 34px 'Noto Sans Thai','Tahoma',sans-serif;fill:#0f172a}.sub{font:400 18px 'Noto Sans Thai','Tahoma',sans-serif;fill:#475569}.root{font:700 25px Consolas,'Noto Sans Thai',monospace;fill:#ffffff}.h{font:700 21px 'Noto Sans Thai','Tahoma',sans-serif;fill:#0f172a}.file{font:400 15px Consolas,'Noto Sans Thai',monospace;fill:#334155}.note{font:400 14px 'Noto Sans Thai','Tahoma',sans-serif;fill:#64748b}.branch{fill:none;stroke:#94a3b8;stroke-width:3}</style>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="70" y="65" class="title">ภาพที่ 5-3  โครงสร้างซอฟต์แวร์ปัจจุบัน</text>
  <text x="70" y="100" class="sub">Repository เดียวเชื่อม Data pipeline, XGBoost/SHAP, FastAPI, Next.js และ Streamlit</text>

