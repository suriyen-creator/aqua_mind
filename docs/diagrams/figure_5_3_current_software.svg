  <rect x="350" y="845" width="900" height="75" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="800" y="878" text-anchor="middle" class="h">เส้นทางใช้งานจริง</text>
  <text x="800" y="906" text-anchor="middle" class="note">Open-Meteo / Earth Search → backend → XGBoost + SHAP → FastAPI → Next.js หรือ Streamlit</text>
